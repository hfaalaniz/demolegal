<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- balanza / scales of justice — vara central, travesaño, cadenas y platillos -->
  <symbol id="ico-scales" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- vara vertical central -->
    <line x1="12" y1="3" x2="12" y2="21"/>
    <!-- base horizontal -->
    <line x1="6" y1="21" x2="18" y2="21"/>
    <!-- travesaño horizontal superior -->
    <line x1="3" y1="7" x2="21" y2="7"/>
    <!-- cadenas izquierda: travesaño → platillo -->
    <line x1="5"  y1="7" x2="3"  y2="13"/>
    <line x1="3"  y1="7" x2="5"  y2="13"/>
    <!-- platillo izquierdo (arco inferior) -->
    <path d="M1 13 a4 1.2 0 0 0 8 0"/>
    <!-- cadenas derecha: travesaño → platillo -->
    <line x1="19" y1="7" x2="21" y2="13"/>
    <line x1="21" y1="7" x2="19" y2="13"/>
    <!-- platillo derecho (arco inferior) -->
    <path d="M15 13 a4 1.2 0 0 0 8 0"/>
    <!-- nudo central en el travesaño -->
    <circle cx="12" cy="7" r="1" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- usuario / person -->
  <symbol id="ico-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
  </symbol>

  <!-- calendario / calendar -->
  <symbol id="ico-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="18" rx="2"/>
    <path d="M16 2v4M8 2v4M3 10h18"/>
    <path d="M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/>
  </symbol>

  <!-- grupo / personas -->
  <symbol id="ico-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="7" r="3.5"/>
    <path d="M2 20c0-3.5 3.1-6 7-6s7 2.5 7 6"/>
    <circle cx="17" cy="7" r="2.5"/>
    <path d="M22 20c0-2.5-2-4.5-5-5"/>
  </symbol>

  <!-- escudo -->
  <symbol id="ico-shield" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2l8 3v6c0 5-3.5 9-8 10C7.5 20 4 16 4 11V5l8-3z"/>
    <path d="M9 12l2 2 4-4"/>
  </symbol>

  <!-- apretón de manos -->
  <symbol id="ico-handshake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12l4-4 3 1 3-3 3 1 3-3 4 4"/>
    <path d="M2 12l4 4c1 1 2.5 1 3.5 0l1-1c1-1 2.5-1 3.5 0l1 1c1 1 2.5 1 3.5 0l4-4"/>
  </symbol>

  <!-- ubicación / pin -->
  <symbol id="ico-location" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2C8.7 2 6 4.7 6 8c0 5 6 13 6 13s6-8 6-13c0-3.3-2.7-6-6-6z"/>
    <circle cx="12" cy="8" r="2"/>
  </symbol>

  <!-- email / sobre -->
  <symbol id="ico-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="16" rx="2"/>
    <path d="M2 7l10 7 10-7"/>
  </symbol>

  <!-- instagram / cámara -->
  <symbol id="ico-instagram" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="5"/>
    <circle cx="12" cy="12" r="4"/>
    <circle cx="17.5" cy="6.5" r=".5" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- teléfono -->
  <symbol id="ico-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2"/>
  </symbol>

  <!-- documento / scroll -->
  <symbol id="ico-document" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
    <path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/>
  </symbol>

  <!-- familia -->
  <symbol id="ico-family" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="6" r="2.5"/>
    <circle cx="16" cy="6" r="2"/>
    <path d="M2 19c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
    <path d="M16 13c2.5.5 4.5 2.5 5 5"/>
    <path d="M12 10h1"/>
  </symbol>

  <!-- check delgado -->
  <symbol id="ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="20 6 9 17 4 12"/>
  </symbol>

  <!-- flecha derecha delgada -->
  <symbol id="ico-arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14M13 6l6 6-6 6"/>
  </symbol>

  <!-- whatsapp -->
  <symbol id="ico-whatsapp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/>
  </symbol>

</svg>
